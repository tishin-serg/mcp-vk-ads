name: Refresh runtime dependencies

on:
  push:
    branches: [ST/security-hardening-v1]

permissions:
  contents: write

concurrency:
  group: refresh-runtime-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ST/security-hardening-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Regenerate shrinkwrap from pinned dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed dependency metadata
        shell: bash
        run: |
          git add package.json npm-shrinkwrap.json
          if git diff --cached --quiet; then
            echo "Dependency metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh patched runtime dependencies"
          git push origin HEAD:ST/security-hardening-v1
